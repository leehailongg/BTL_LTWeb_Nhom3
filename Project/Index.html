
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReUseHub - Người mua</title>
   <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <h2>♻ ReUseHub</h2>
        <input type="text" id="timKiem" placeholder="Tìm kiếm sản phẩm...">
        <nav>
            <a href="#">Trang chủ</a>
            <a class="active" href="#">Người mua</a>
            <a  href="#">Người bán</a>
            <a href="#">Người sửa chữa</a>
            <a href="#">Hồ sơ</a>
        </nav>
    </header>

    <main>
        <p class="duongdan">Trang chủ / Người mua / khám phá sản phẩm</p>

        <h1>Khám phá sản phẩm <span>đã qua sử dụng </span></h1>
        <p class="mota">Lựa chọn bền vững cho cuộc sống xanh</p>

        <div class="boloc">
            <div>
                <label>Danh mục</label>
                <select id="danhMuc">
                    <option value="Tất cả">Tất cả danh mục</option>
                    <option value="Nội thất">Nội thất</option>
                    <option value="Đồ điện">Đồ điện</option>
                    <option value="Đồ cá nhân">Đồ cá nhân</option>
                </select>
            </div>

            <div>
                <label>Mức Giá</label>
                <select id="MucGia">
                    <option value="Tất cả">Tất cả mức giá</option>
                    <option value="thấp đến cao">Từ thấp đến cao</option>
                    <option value="cao đến thấp">từ cao đến thấp</option>
                </select>
            </div>

            <div>
                <label>xếp hạng</label>
                <select id="xepHang">
                    <option value="0">Tất cả xếp hạng</option>
                    <option value="50">5 sao</option>
                    <option value="40">4 sao</option>
                    <option value="30">3 sao</option>
                    <option value="20">2 sao</option> 
                    <option value="10">1 sao</option>
                </select>
            </div>

            <button onclick="locSanPham()">Bộ lọc</button>
        </div>

        <p id="soLuong"></p>
        <div id="danhSach" class="danhsach"></div>
    </main>

    <script src="JS/main.js"></script>
</body>
</html>
