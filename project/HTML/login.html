<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang đăng nhập & đăng ký - ReUseHub</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Chỉ sử dụng 1 file CSS cho trang đăng nhập/đăng ký -->
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-bg-decorations" aria-hidden="true">
      <svg class="decor-leaf decor-leaf-1" viewBox="0 0 30 20" fill="#6f9372"><path d="M0 0 C12 -10 26 -5 28 8 C18 16 4 12 0 0 Z"/></svg>
      <svg class="decor-leaf decor-leaf-2" viewBox="0 0 30 20" fill="#52796f"><path d="M0 0 C10 -10 24 -4 25 7 C15 13 3 10 0 0 Z"/></svg>
      <svg class="decor-leaf decor-leaf-3" viewBox="0 0 30 20" fill="#7ba084"><path d="M0 0 C11 -11 25 -5 27 7 C16 14 3 11 0 0 Z"/></svg>
      <svg class="decor-leaf decor-leaf-4" viewBox="0 0 30 20" fill="#6f9372"><path d="M0 0 C9 -9 20 -4 21 6 C13 11 3 9 0 0 Z"/></svg>
      <span class="decor-dot decor-dot-1"></span>
      <span class="decor-dot decor-dot-2"></span>
      <span class="decor-dot decor-dot-3"></span>
    </div>

    <div class="auth-container">

      <!-- KHU VỰC BÊN TRÁI -->
      <section class="auth-left-panel" aria-label="Giới thiệu ReUseHub">
        <div class="brand-header">
          <a href="index.html" class="logo brand-logo-link" title="Về ReUseHub">
            <span class="logo-icon">♻</span>
            <span class="logo-text brand-title">ReuseHub</span>
          </a>
          <p class="brand-slogan">Trao vòng đời mới cho đồ dùng</p>
        </div>

        <div class="illustration-wrapper">
          <img 
            src="https://res.cloudinary.com/db4uf6vj0/image/upload/v1793031987/Pngtree_people_gathering_plastic_bottles_into_7259391_icpiul.png" 
            alt="Minh họa tái sử dụng đồ dùng"
            class="illustration-img"
          >
        </div>
      </section>

      <!-- KHU VỰC BÊN PHẢI -->
      <section class="auth-right-panel" aria-label="Biểu mẫu đăng nhập và đăng ký">
        <div class="auth-card">

          <!-- Hai tab Đăng nhập và Đăng ký trên đầu thẻ -->
          <nav class="auth-tabs" aria-label="Điều hướng tài khoản">
            <span class="tab-link active" id="tabLoginBtn" role="button" tabindex="0">Đăng nhập</span>
            <span class="tab-link" id="tabRegisterBtn" role="button" tabindex="0">Đăng ký</span>
          </nav>

          <!-- 1. KHỐI FORM ĐĂNG NHẬP -->
          <div id="loginFormSection" class="auth-form-section">
            <h1 class="form-heading">Chào mừng trở lại</h1>

            <form id="loginForm" method="POST" novalidate>

              <div class="form-group">
                <label for="emailOrPhone" class="form-label">Email hoặc số điện thoại</label>
                <div class="input-wrapper">
                  <input 
                    type="text" 
                    id="emailOrPhone" 
                    name="emailOrPhone" 
                    class="form-input" 
                    placeholder="Nhập email hoặc số điện thoại"
                    autocomplete="username"
                    required
                  >
                </div>
                <div id="emailOrPhoneError" class="field-error-msg" role="alert"></div>
              </div>

              <div class="form-group">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-wrapper input-with-toggle">
                  <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="Nhập mật khẩu"
                    autocomplete="current-password"
                    required
                  >
                  <button 
                    type="button" 
                    id="btnTogglePassword" 
                    class="btn-toggle-password" 
                    aria-label="Hiện mật khẩu" 
                    title="Hiện hoặc ẩn mật khẩu"
                  >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
                <div id="passwordError" class="field-error-msg" role="alert"></div>
              </div>

              <div class="form-actions-row">
                <a href="#" id="linkForgotPassword" class="forgot-password-link">Quên mật khẩu?</a>
              </div>

              <button type="submit" id="btnLoginSubmit" class="btn-submit">
                <span class="btn-spinner" aria-hidden="true"></span>
                <span id="btnSubmitText">Đăng nhập</span>
              </button>

              <div class="divider-row" aria-hidden="true">
                <div class="divider-line"></div>
                <span class="divider-text">hoặc</span>
                <div class="divider-line"></div>
              </div>

              <button type="button" id="btnGoogleLogin" class="btn-google">
                <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Đăng nhập với Google</span>
              </button>

              <div class="form-footer">
                <span>Chưa có tài khoản?</span>
                <a href="#" id="linkRegisterBottom" class="signup-link">Đăng ký</a>
              </div>

            </form>
          </div>

          <!-- 2. KHỐI FORM ĐĂNG KÝ (Ẩn ban đầu, chuyển đổi khi nhấn Đăng ký) -->
          <div id="registerFormSection" class="auth-form-section" style="display: none;">
            <h1 class="form-heading">Tạo tài khoản mới</h1>

            <form id="registerForm" method="POST" novalidate>

              <div class="form-group">
                <label for="regFullName" class="form-label">Họ và tên</label>
                <div class="input-wrapper">
                  <input 
                    type="text" 
                    id="regFullName" 
                    name="regFullName" 
                    class="form-input" 
                    placeholder="Nguyễn Văn A"
                    autocomplete="name"
                    required
                  >
                </div>
                <div id="regFullNameError" class="field-error-msg" role="alert"></div>
              </div>

              <div class="form-group">
                <label for="regEmailOrPhone" class="form-label">Email hoặc số điện thoại</label>
                <div class="input-wrapper">
                  <input 
                    type="text" 
                    id="regEmailOrPhone" 
                    name="regEmailOrPhone" 
                    class="form-input" 
                    placeholder="example@gmail.com hoặc 0912345678"
                    autocomplete="username"
                    required
                  >
                </div>
                <div id="regEmailOrPhoneError" class="field-error-msg" role="alert"></div>
              </div>

              <div class="form-group">
                <label for="regPassword" class="form-label">Mật khẩu</label>
                <div class="input-wrapper input-with-toggle">
                  <input 
                    type="password" 
                    id="regPassword" 
                    name="regPassword" 
                    class="form-input" 
                    placeholder="Tối thiểu 6 ký tự"
                    autocomplete="new-password"
                    required
                  >
                  <button 
                    type="button" 
                    id="btnToggleRegPassword" 
                    class="btn-toggle-password" 
                    aria-label="Hiện mật khẩu" 
                    title="Hiện hoặc ẩn mật khẩu"
                  >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
                <div id="regPasswordError" class="field-error-msg" role="alert"></div>
              </div>

              <div class="form-group">
                <label for="regConfirmPassword" class="form-label">Xác nhận mật khẩu</label>
                <div class="input-wrapper input-with-toggle">
                  <input 
                    type="password" 
                    id="regConfirmPassword" 
                    name="regConfirmPassword" 
                    class="form-input" 
                    placeholder="Nhập lại mật khẩu"
                    autocomplete="new-password"
                    required
                  >
                  <button 
                    type="button" 
                    id="btnToggleRegConfirmPassword" 
                    class="btn-toggle-password" 
                    aria-label="Hiện mật khẩu" 
                    title="Hiện hoặc ẩn mật khẩu"
                  >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
                <div id="regConfirmPasswordError" class="field-error-msg" role="alert"></div>
              </div>

              <button type="submit" id="btnRegisterSubmit" class="btn-submit">
                <span class="btn-spinner" aria-hidden="true"></span>
                <span id="btnRegSubmitText">Đăng ký tài khoản</span>
              </button>

              <div class="form-footer">
                <span>Đã có tài khoản?</span>
                <a href="#" id="linkLoginBottom" class="signup-link">Đăng nhập</a>
              </div>

            </form>
          </div>

        </div>
      </section>

    </div>
  </main>

  <!-- Chỉ sử dụng 1 file JS cho trang đăng nhập/đăng ký -->
  <script src="login.js"></script>
</body>
</html>
